name: Lean formal supplement

on:
  push:
    paths:
      - "formal/**"
      - ".github/workflows/lean-formal.yml"
      - "papers/hypothesis-language/formal/**"
  pull_request:
    paths:
      - "formal/**"
      - ".github/workflows/lean-formal.yml"
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0 via elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.36.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check source hashes before compilation
        run: |
          echo "fcdcb52c6407b726a93cb804388dbf38fd239ef2798cb8ccd7ebb4c14dc2be90  ControlledRepChange.lean" | sha256sum --check
          echo "7c5d80eb3f78d5e616f74c0c4c2b83d41d417c948f32899fc8413733d38ef7ee  DFAto1DCASeparation.lean" | sha256sum --check
      - name: Compile both Lean modules
        run: |
          lean --version
          lean ControlledRepChange.lean
          lean DFAto1DCASeparation.lean
      - name: Verify hypothesis-language finite Lean theorems
        run: |
          cd ../papers/hypothesis-language/formal
          echo "2baaffcb0b30bea445917b3dfbf7c75823cff4213d0ab53b955eb0fbe6b49d78  gate5_invariants.lean" | sha256sum --check
          lean gate5_invariants.lean
